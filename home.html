        /* 基礎設定 */
        body, html {
            margin: 0;

        }

        /* 導覽列 */
        nav {
            background-color: #1a2a47;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            padding: 5px 15px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #f0ad4e;
        }

        /* 地圖區域 */
        .banner {
            height: 450px;       
            width: 100%;
            margin-top: 0;
            z-index: 5;          
            border-radius: 0 0 20px 20px;
            background-image: none !important; 
            background-color: #f0f2f5;        
        }

        #map {
            width: 100%;
            height: 450px; 
            margin: 0 auto;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            background-image: none !important;
            background-color: #f8f9fa; 
            position: relative;
            z-index: 1; 
            overflow: hidden;
        }

        /* 地圖內彈出視窗美化 */
        .leaflet-popup-content-wrapper {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            border-radius: 8px;
            padding: 2px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .leaflet-popup-content {
            margin: 12px 15px;
            line-height: 1.6;
            font-size: 14px;
            color: #2c3e50;
        }

        .leaflet-popup-tip {
            background: white;
        }

        /* 深色按鈕操作區 */
        .button-section {
            background-color: #0d1b31;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .btn {
            padding: 12px 35px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
        }

        /* 按鈕顏色設定 */
        .btn-blue { background-color: #2980b9; }
        .btn-red { background-color: #c0392b; }
        .btn-orange { background-color: #e67e22; }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 下方統計色塊區 */
        .stats-section {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            gap: 40px;
            flex-wrap: wrap;
        }

        .card-block {
            width: 280px;
            height: 250px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .card-block:hover {
            transform: scale(1.02);
        }

        /* 淺色塊樣式 */
        .bg-red { 
            background-color: #fdf2f2; 
            color: #b91c1c; 
        }
        .bg-green { 
            background-color: #f0fdf4; 
            color: #15803d; 
        }
        .bg-orange { 
            background-color: #fffaf2; 
            color: #b45309; 
        }

        .label {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .number-large {
            font-size: 3.5rem;
        }
    </style>

            };

            if (percent > 70) {
                let severity = (percent - 70) / 30;
                config.radius = 8 + (severity * 12);
                config.fillColor = "#e74c3c";
                config.weight = 2;
                config.fillOpacity = 0.7 + (severity * 0.2);
                config.light = "red";
            } else if (percent < 30) {
                let severity = (30 - percent) / 30;
                config.radius = 8 + (severity * 12);
                config.fillColor = "#e67e22";
                config.weight = 2;
                config.fillOpacity = 0.7 + (severity * 0.2);
                config.light = "orange";
            }
            return config;
        }

        // 初始化
        mapStations.forEach(st => {
            let circle = L.circleMarker([st.lat, st.lng], {
                radius: 6, fillColor: "#bdc3c7", color: "#fff", weight: 1, fillOpacity: 0.5
            }).addTo(map);
            
            circle.bindPopup(`<b>${st.name}</b><br>資料讀取中`);
            markers[st.id] = { circle: circle, name: st.name };
        });

        // 抓取CSV
        function fetchCurrentMapData() {
            const timestamp = new Date().getTime();
            const currentDataCsv = 'data/cleaned_weather.csv';

            Papa.parse(`${currentDataCsv}?t=${timestamp}`, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const rows = results.data;
                    let currentData = {};

                    // 保留最後一筆
                    rows.forEach(row => {
                        const stationId = String(row['station_id'] || '').trim();
                        const totalSlots = parseInt(row['total_slots']) || 0;
                        const bikes = parseInt(row['bikes']) || 0;

                        if (stationId && stationId !== 'undefined') {
                            currentData[stationId] = { total: totalSlots, bikes: bikes };
                        }
                    });

                    // 準備統計數量
                    let redCount = 0, greenCount = 0, orangeCount = 0;

                    Object.keys(markers).forEach(id => {
                        let data = currentData[id];
                        if (data) {
                            let percent = data.total > 0 ? (data.bikes / data.total) * 100 : 0;
                            let style = getStationMarkerStyle(percent);
                            
                            // 更新圓圈樣式與大小
                            markers[id].circle.setStyle({
                                radius: style.radius,
                                fillColor: style.fillColor,
                                color: style.color,
                                weight: style.weight,
                                fillOpacity: style.fillOpacity
                            });

                            // 更新點擊彈出視窗內容
                            markers[id].circle.setPopupContent(`
                                <div style="font-size:14px; font-family: 'Microsoft JhengHei';">
                                    <b>${markers[id].name}</b><br>
                                    可借車輛：<span style="color:${style.fillColor}; font-weight:bold;">${data.bikes}</span> / ${data.total}
                                </div>
                            `);

                            // 累加對應的燈號數量
                            if (style.light === 'red') redCount++;
                            else if (style.light === 'orange') orangeCount++;
                            else greenCount++;
                        }
                    });

                    // 更新畫面統計數字
                    document.getElementById('count-red').innerText = redCount;
                    document.getElementById('count-green').innerText = greenCount;
                    document.getElementById('count-orange').innerText = orangeCount;

                    console.log(`首頁地圖更新 統計：紅(${redCount}) 綠(${greenCount}) 橘(${orangeCount})`);
                },
                error: function(err) {
                    console.error("讀取失敗：", err);
                }
            });
        }

        // 1分鐘刷新刷新
        fetchCurrentMapData();
        setInterval(fetchCurrentMapData, 60000);
    </script>
</body>
</html>
